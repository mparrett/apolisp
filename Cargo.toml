[package]
name = "apolisp"
version = "0.1.0"
edition = "2021"

[dependencies]
# ADR-045: two, both outside the line budget, both pre-approved by ADR-014 for
# exactly this. The *language* still has none — `cargo tree
# --no-default-features` shows an empty tree, and that stays checkable.
crossterm = { version = "0.28", optional = true }
serde_json = { version = "1", optional = true }

# ADR-013: features gate *host capability* and never language semantics, so
# there is one language here and not 2ⁿ. They exist as the subtraction test
# harness rather than for users — building with an adapter cut out is how
# "seams exist for subtraction" stays a fact. `just verify` builds without
# them, because a seam nothing compiles is a seam nobody can trust.
[features]
default = ["fs", "tcp", "term", "json"]
fs = []
tcp = []
term = ["dep:crossterm"]
json = ["dep:serde_json"]

[profile.release]
# ADR-037 makes *language* arithmetic checked explicitly, so the two profiles
# agree without this. It stays for the other half: Rust-level arithmetic inside
# the VM — slot indices, frame offsets — where an overflow is a host bug and
# release would otherwise wrap silently.
overflow-checks = true
